<p-sidebar [(visible)]="isOpen" position="right">
    <h1>Themes</h1>
    <ul>
        <li *ngFor="let theme of availableThemes"
            (click)="setTheme(theme.path)"
        >   
            <input type="checkbox" [checked]="theme.isCurrent">
            {{ theme.name }}
        </li>
    </ul>
</p-sidebar>
